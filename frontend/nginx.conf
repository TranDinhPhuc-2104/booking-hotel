server {
    listen 80;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        return 200 "ok";
    }

    # Angular routes (/hotels/1, /manager, ...) are client-side: serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
