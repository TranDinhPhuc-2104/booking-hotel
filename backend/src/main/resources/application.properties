spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:${AWS_PORT}/booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Required: at least 32 characters
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=120
app.cors.allowed-origin=http://localhost:4200

# Hotel photos are stored here and served at /uploads/**
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# First admin is created at startup when both are set and no admin exists
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
