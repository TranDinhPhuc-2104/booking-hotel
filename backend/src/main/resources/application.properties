spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Required: at least 32 characters
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=120
app.cors.allowed-origin=http://localhost:4200

# Hotel photos go to S3 when S3_BUCKET is set; otherwise they are stored here and served at /uploads/**
app.upload-dir=${UPLOAD_DIR:uploads}
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${S3_REGION:us-east-1}
# Base URL browsers load photos from, e.g. https://<bucket>.s3.us-east-1.amazonaws.com or a CloudFront domain
app.s3.public-url=${S3_PUBLIC_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# First admin is created at startup when both are set and no admin exists
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Everything the ALB sends to the backend lives under /api/* (plus /uploads/* for hotel photos)
management.endpoints.web.base-path=/api/actuator
